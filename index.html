<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Team Hille</title>

  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #fff;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .logo {
      width: 113px;
      height: 113px;
      object-fit: contain;
      margin-top: 28vh;

    @media (max-width: 600px) {
      .logo {
        width: 72px;
        height: 72px;
        margin-top: 24vh;
      }
    }
  </style>
</head>

<body>
  <img class="logo" src="logo.png" alt="Team Hille">
</body>
</html>
